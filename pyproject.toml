[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alphalab"
version = "0.1.0"
description = "Plateforme de recherche et de production de plans de trading intraday"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.2.6",
    "pandas==2.3.3",
    "scipy==1.15.3",
    "scikit-learn==1.7.2",
]

[project.optional-dependencies]
# Telechargement des donnees : necessite un acces reseau a Dukascopy / FRED.
# Non installe en CI (le reseau de donnees de marche y est bloque).
fetch = ["dukascopy-python==4.0.1", "requests==2.32.3"]
dev = [
    "pytest==9.1.1",
    "ruff==0.9.6",
    "mypy==1.15.0",
    "pandas-stubs",
]

[project.scripts]
alphalab = "alphalab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Les notebooks de `legacy` sont une archive figee (seule trace de la Session 1),
# pas du code maintenu : on ne les reformate pas.
extend-exclude = ["notebooks/legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "ARG", "PTH"]
ignore = [
    "RUF001",  # caracteres unicode ambigus : les docstrings sont en francais
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# N802 : les noms de tests contiennent "R" (unite de risque du projet), en majuscule
# a dessein — c'est le vocabulaire du domaine, pas une entorse de style.
"tests/*" = ["ARG", "N802", "N806"]
# X (matrice de features) et y (labels) sont la convention universelle en
# apprentissage statistique. Les renommer nuirait a la lisibilite pour un lecteur
# du domaine.
"src/alphalab/model/*" = ["N803", "N806"]
"src/alphalab/report/daily.py" = ["N806"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
plugins = []
disallow_untyped_defs = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_reexport = true

[[tool.mypy.overrides]]
module = ["scipy.*", "sklearn.*", "dukascopy_python.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests qui lisent les snapshots complets (86 Mo) et calculent leur sha256",
]
addopts = "-q --strict-markers"
