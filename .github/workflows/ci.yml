name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # Les extras `fetch` (dukascopy) ne sont PAS installes : la CI n'a aucun acces
      # aux fournisseurs de donnees de marche, et n'en a pas besoin. Les snapshots
      # sont versionnes dans le depot, les tests unitaires tournent sur des fixtures
      # synthetiques.
      - name: Installation
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Typage (mypy strict)
        run: mypy src

      - name: Tests rapides
        run: pytest -m "not slow"

      # Verifie le sha256 des snapshots immuables. Si ce job echoue, une donnee de
      # reference a bouge : tout resultat publie devient suspect.
      - name: Integrite des snapshots
        run: pytest -m slow
